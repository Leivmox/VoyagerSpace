<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份验证 - Voyager Space System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>

        <div class="login-card">

            <div class="login-header">
                <a href="index.html" class="back-home">← 返回 Return</a>
                <img src="images/logo2.png" alt="Voyager Logo" class="login-logo">
                <h2>Voyager ID Access</h2>
                <p>请输入您的星际通行证凭据</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label>用户代号 / Voyager ID</label>
                    <div class="input-field">
                        <i class="fas fa-user-astronaut"></i>
                        <input type="text" placeholder="Ex: V-88204" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>生物秘钥 / Passcode</label>
                    <div class="input-field">
                        <i class="fas fa-fingerprint"></i>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        保持连接
                    </label>
                    <a href="#" class="forgot-link">遗失凭据?</a>
                </div>

                <div id="login-error" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>
                        <strong>ACCESS DENIED / 访问被拒绝</strong><br>
                        检测到未授权的生物信号 (Level 1)<br>
                        请立即停止尝试，否则将触发安保协议。
                    </span>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">接入系统 CONNECT</span>
                    <span class="btn-glitch"></span>
                </button>
            </form>

            <div class="login-footer">
                <p>受《地外文明接触协议》第 7 章保护</p>
                <p>System Ver 4.0.2 | Secure Connection</p>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            e.preventDefault(); // 1. 阻止表单真的提交（防止刷新页面）
            
            const btn = document.querySelector('.btn-submit');
            const btnText = document.querySelector('.btn-text');
            const errorBox = document.getElementById('login-error');
            const card = document.querySelector('.login-card');
            
            // 2. 模拟加载状态 (变成“正在验证...”)
            const originalText = btnText.innerText;
            btnText.innerText = "Verifying Identity..."; 
            btn.style.opacity = "0.7";
            btn.style.cursor = "wait";
            
            // 先把之前的错误提示关掉（如果是第二次点击）
            errorBox.style.display = 'none';
            card.classList.remove('shake-animation'); // 移除震动class以便再次触发

            // 3. 延迟 1.5秒 后显示失败
            setTimeout(() => {
                // 恢复按钮状态
                btnText.innerText = originalText;
                btn.style.opacity = "1";
                btn.style.cursor = "pointer";
                
                // 显示红色错误框
                errorBox.style.display = 'flex';
                
                // 添加整个卡片的震动特效 (需要配合 CSS 中的 .shake-animation)
                card.classList.add('shake-animation');
                
                // 清空密码框，增加“拒绝感”
                document.querySelector('input[type="password"]').value = "";
                
            }, 1500);
        });
    </script>

</body>
</html>
